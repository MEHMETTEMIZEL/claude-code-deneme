# Yedek: Xcode 15 kullanıyorsan `brew install xcodegen && xcodegen` ile projeyi yeniden üretebilirsin.
name: RequestJourney
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  RequestJourney:
    type: application
    platform: iOS
    sources: [RequestJourney]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RequestJourney
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "İstek Yolculuğu"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
